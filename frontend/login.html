<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Waste AI | Secure Access</title>

    <link rel="icon" type="image/png" href="dustbin-favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green: #63ffb1;
            --green-bright: #8affca;
            --cyan: #48eaff;
            --cyan-soft: #64f4ff;

            --white: #f2fffb;
            --muted: #91aaa3;

            --dark: #020708;
            --panel: rgba(4, 20, 17, 0.68);

            --border: rgba(99, 255, 177, 0.28);
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            overflow-x: hidden;

            font-family: "Inter", sans-serif;

            color: var(--white);

            background:
                #020708;
        }

        button,
        input {
            font-family: inherit;
        }


        /* =========================================================
           CINEMATIC BACKGROUND
        ========================================================= */

        .background {
            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;

            background:
                linear-gradient(
                   rgba(0, 15, 13, 0.35),
                   rgba(0, 8, 10, 0.55)
                ),
                url("Gemini_Generated_Image_nkt866nkt866nkt8.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* =========================================================
           SKY
        ========================================================= */

        .sky {
            position: absolute;

            inset: 0;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(52, 217, 255, 0.10),
                    transparent 20%
                ),
                radial-gradient(
                    circle at 80% 22%,
                    rgba(66, 255, 181, 0.08),
                    transparent 22%
                );
        }


        /* =========================================================
           STARS
        ========================================================= */

        .stars {
            position: absolute;

            inset: 0;

            background-image:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.9) 1px,
                    transparent 1.5px
                ),
                radial-gradient(
                    circle,
                    rgba(100,255,221,0.7) 1px,
                    transparent 1.5px
                ),
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.55) 1px,
                    transparent 1.5px
                );

            background-size:
                125px 125px,
                210px 210px,
                320px 320px;

            background-position:
                15px 30px,
                80px 100px,
                150px 20px;

            opacity: 0.48;

            animation: starDrift 30s linear infinite;
        }

        @keyframes starDrift {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(35px);
            }
        }


        /* =========================================================
           DISTANT FUTURISTIC CITY
        ========================================================= */

        .city {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 17%;

            height: 31%;

            display: flex;

            justify-content: center;

            align-items: flex-end;

            gap: 9px;

            opacity: 0.58;
        }

        .building {
            position: relative;

            width: clamp(32px, 4.5vw, 80px);

            background:
                linear-gradient(
                    180deg,
                    rgba(10, 42, 45, 0.95),
                    rgba(2, 17, 20, 0.99)
                );

            border:
                1px solid rgba(73, 237, 222, 0.12);

            box-shadow:
                inset 0 0 35px rgba(65, 255, 220, 0.035);
        }

        .building::before {
            content: "";

            position: absolute;

            inset: 10px 7px;

            background-image:
                linear-gradient(
                    90deg,
                    transparent 70%,
                    rgba(82,255,211,0.42) 71%,
                    transparent 72%
                ),
                linear-gradient(
                    0deg,
                    transparent 70%,
                    rgba(82,255,211,0.36) 71%,
                    transparent 72%
                );

            background-size:
                15px 18px;

            opacity: 0.55;
        }

        .building::after {
            content: "";

            position: absolute;

            left: 50%;

            top: 0;

            width: 1px;

            height: 100%;

            background:
                linear-gradient(
                    transparent,
                    rgba(78,255,219,0.18),
                    transparent
                );
        }

        .building:nth-child(1) {
            height: 40%;
        }

        .building:nth-child(2) {
            height: 63%;
        }

        .building:nth-child(3) {
            height: 35%;
        }

        .building:nth-child(4) {
            height: 76%;
        }

        .building:nth-child(5) {
            height: 51%;
        }

        .building:nth-child(6) {
            height: 87%;
        }

        .building:nth-child(7) {
            height: 45%;
        }

        .building:nth-child(8) {
            height: 68%;
        }

        .building:nth-child(9) {
            height: 37%;
        }

        .building:nth-child(10) {
            height: 56%;
        }


        /* =========================================================
           FUTURISTIC DOMES
        ========================================================= */

        .dome {
            position: absolute;

            bottom: 22%;

            width: 170px;
            height: 88px;

            border-radius:
                170px 170px 0 0;

            border:
                1px solid rgba(84,255,221,0.34);

            background:
                radial-gradient(
                    ellipse at center bottom,
                    rgba(60,255,207,0.13),
                    rgba(3,23,28,0.48) 65%
                );

            box-shadow:
                0 0 40px rgba(53,244,215,0.08),
                inset 0 0 30px rgba(70,255,219,0.08);
        }

        .dome::before {
            content: "";

            position: absolute;

            left: 50%;
            bottom: 0;

            width: 1px;
            height: 100%;

            background:
                rgba(97,255,225,0.24);
        }

        .dome::after {
            content: "";

            position: absolute;

            left: 15%;
            right: 15%;
            bottom: 0;

            height: 1px;

            background:
                rgba(97,255,225,0.24);

            box-shadow:
                0 -25px 0 rgba(97,255,225,0.12),
                0 -50px 0 rgba(97,255,225,0.08);
        }

        .dome-left {
            left: 6%;
        }

        .dome-right {
            right: 6%;

            transform: scale(1.25);
        }


        /* =========================================================
           SMART BINS
        ========================================================= */

        .smart-bin {
            position: absolute;

            bottom: 15%;

            width: 48px;
            height: 64px;

            border-radius: 7px;

            background:
                linear-gradient(
                    145deg,
                    rgba(31,85,75,0.95),
                    rgba(4,26,22,0.99)
                );

            border:
                1px solid rgba(92,255,199,0.3);

            box-shadow:
                0 0 30px rgba(66,255,192,0.11);
        }

        .smart-bin::before {
            content: "♻";

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            color:
                rgba(92,255,199,0.68);

            font-size: 18px;
        }

        .smart-bin::after {
            content: "";

            position: absolute;

            top: -7px;

            left: 4px;
            right: 4px;

            height: 8px;

            border-radius:
                5px 5px 2px 2px;

            background:
                rgba(76,255,194,0.55);

            box-shadow:
                0 0 14px rgba(76,255,194,0.3);
        }

        .bin-left {
            left: 12%;
        }

        .bin-right {
            right: 12%;

            transform: scale(0.8);
        }


        /* =========================================================
           FUTURISTIC ROAD
        ========================================================= */

        .road {
            position: absolute;

            left: 50%;
            bottom: -7%;

            transform:
                translateX(-50%)
                perspective(500px)
                rotateX(65deg);

            width: 76%;
            height: 36%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(30,255,195,0.045),
                    rgba(55,234,255,0.08),
                    rgba(30,255,195,0.045),
                    transparent
                );

            border-top:
                1px solid rgba(67,255,214,0.12);

            box-shadow:
                0 -20px 70px rgba(46,255,206,0.06);
        }

        .road::before {
            content: "";

            position: absolute;

            left: 50%;
            top: -30%;

            width: 2px;
            height: 140%;

            transform:
                translateX(-50%);

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(87,255,220,0.6) 0 30px,
                    transparent 30px 65px
                );

            box-shadow:
                0 0 12px rgba(87,255,220,0.45);
        }


        /* =========================================================
           REFLECTIVE GROUND
        ========================================================= */

        .reflection {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 24%;

            background:
                linear-gradient(
                    180deg,
                    transparent,
                    rgba(20,132,118,0.14)
                );

            opacity: 0.9;
        }

        .reflection::before {
            content: "";

            position: absolute;

            inset: 0;

            background:
                repeating-linear-gradient(
                    90deg,
                    transparent 0 45px,
                    rgba(91,255,218,0.055) 46px,
                    transparent 48px 90px
                );

            animation:
                reflectionMove 8s linear infinite;
        }

        @keyframes reflectionMove {

            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(90px);
            }
        }


        /* =========================================================
           ATMOSPHERIC LIGHT
        ========================================================= */

        .light-beam {
            position: absolute;

            width: 450px;
            height: 450px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(54,255,202,0.16),
                    rgba(54,255,202,0.04) 35%,
                    transparent 70%
                );

            filter: blur(15px);

            animation:
                lightPulse 5s ease-in-out infinite;
        }

        .light-one {
            left: -160px;
            bottom: 4%;
        }

        .light-two {
            right: -160px;
            bottom: 10%;

            background:
                radial-gradient(
                    circle,
                    rgba(55,220,255,0.14),
                    transparent 70%
                );

            animation-delay: 2s;
        }

        @keyframes lightPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }

            50% {
                transform: scale(1.12);
                opacity: 1;
            }
        }


        /* =========================================================
           FLOATING PARTICLES
        ========================================================= */

        .particle {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background:
                #6dffcf;

            box-shadow:
                0 0 12px #6dffcf;

            opacity: 0;

            animation:
                particleFloat linear infinite;
        }

        .particle:nth-child(1) {
            left: 8%;
            top: 70%;
            animation-duration: 9s;
        }

        .particle:nth-child(2) {
            left: 18%;
            top: 45%;
            animation-duration: 12s;
        }

        .particle:nth-child(3) {
            left: 30%;
            top: 80%;
            animation-duration: 10s;
        }

        .particle:nth-child(4) {
            left: 44%;
            top: 25%;
            animation-duration: 13s;
        }

        .particle:nth-child(5) {
            left: 62%;
            top: 70%;
            animation-duration: 11s;
        }

        .particle:nth-child(6) {
            left: 74%;
            top: 38%;
            animation-duration: 14s;
        }

        .particle:nth-child(7) {
            left: 88%;
            top: 65%;
            animation-duration: 10s;
        }

        .particle:nth-child(8) {
            left: 95%;
            top: 20%;
            animation-duration: 12s;
        }

        @keyframes particleFloat {

            0% {
                transform:
                    translate3d(0,40px,0)
                    scale(0.4);

                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            80% {
                opacity: 0.8;
            }

            100% {
                transform:
                    translate3d(30px,-130px,0)
                    scale(1);

                opacity: 0;
            }
        }


        /* =========================================================
           VIGNETTE
        ========================================================= */

        .background::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 25%,
                    rgba(0,5,7,0.22) 60%,
                    rgba(0,3,5,0.78) 100%
                );
        }


        /* =========================================================
           PAGE
        ========================================================= */

        .page {
            position: relative;

            z-index: 5;

            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                35px 20px;
        }


        /* =========================================================
           AUTH CONTAINER
        ========================================================= */

        .auth-container {
            width: min(450px, 100%);

            animation:
                pageEnter 0.9s ease forwards;
        }

        @keyframes pageEnter {

            from {
                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.98);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================================================
           BRAND
        ========================================================= */

        .brand {
            text-align: center;

            margin-bottom: 25px;
        }

        .logo {
            position: relative;

            width: 70px;
            height: 70px;

            margin:
                0 auto 17px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 21px;

            font-size: 34px;

            color: #02130d;

            background:
                linear-gradient(
                    145deg,
                    #8affca,
                    #32d99b
                );

            box-shadow:
                0 0 30px rgba(99,255,177,0.3),
                0 18px 55px rgba(0,0,0,0.4);

            animation:
                logoFloat 4s ease-in-out infinite;
        }

        .logo::before {
            content: "";

            position: absolute;

            inset: -6px;

            border-radius: 25px;

            border:
                1px solid rgba(99,255,177,0.4);

            box-shadow:
                0 0 25px rgba(99,255,177,0.12);

            animation:
                logoPulse 2.6s ease-in-out infinite;
        }

        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        @keyframes logoPulse {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.08);
            }
        }

        .brand h1 {
            font-family:
                "Space Grotesk",
                sans-serif;

            font-size:
                clamp(29px, 6vw, 37px);

            font-weight: 700;

            letter-spacing:
                -0.045em;
        }

        .brand h1 span {
            color: var(--green);
        }

        .brand p {
            margin-top: 7px;

            color: var(--muted);

            font-size: 10px;

            letter-spacing:
                0.05em;
        }


        /* =========================================================
           GLASS LOGIN PANEL
        ========================================================= */

        .card {
            position: relative;

            padding: 34px;

            border-radius: 26px;

            background:
                linear-gradient(
                    145deg,
                    rgba(10,37,31,0.78),
                    rgba(2,15,13,0.72)
                );

            border:
                1px solid rgba(99,255,177,0.28);

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:
                0 35px 100px rgba(0,0,0,0.58),
                0 0 70px rgba(99,255,177,0.07),
                inset 0 1px 0 rgba(255,255,255,0.06);

            overflow: hidden;
        }

        .card::before {
            content: "";

            position: absolute;

            width: 240px;
            height: 240px;

            top: -150px;
            right: -120px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(99,255,177,0.18),
                    transparent 70%
                );
        }

        .card::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            bottom: -120px;
            left: -90px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(71,234,255,0.14),
                    transparent 70%
                );
        }


        /* =========================================================
           CARD TOP LIGHT
        ========================================================= */

        .card-top-line {
            position: absolute;

            top: 0;
            left: 15%;

            width: 70%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(99,255,177,0.7),
                    transparent
                );

            box-shadow:
                0 0 15px rgba(99,255,177,0.35);
        }


        /* =========================================================
           HEADING
        ========================================================= */

        .heading {
            margin-bottom: 25px;
        }

        .heading .status {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 12px;

            color: var(--green);

            font-family:
                "Space Grotesk",
                sans-serif;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing:
                0.13em;
        }

        .status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                var(--green);

            box-shadow:
                0 0 10px var(--green);

            animation:
                statusPulse 1.8s infinite;
        }

        @keyframes statusPulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.35;
                transform: scale(0.75);
            }
        }

        .heading h2 {
            font-family:
                "Space Grotesk",
                sans-serif;

            font-size: 27px;

            font-weight: 600;

            letter-spacing:
                -0.035em;
        }

        .heading p {
            margin-top: 7px;

            color: var(--muted);

            font-size: 10px;

            line-height: 1.6;
        }


        /* =========================================================
           FORM FIELDS
        ========================================================= */

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            color: #b6ccc5;

            font-size: 9px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing:
                0.09em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform:
                translateY(-50%);

            color:
                var(--green);

            font-size: 13px;

            z-index: 2;

            pointer-events: none;
        }

        .field input {
            width: 100%;

            height: 51px;

            padding:
                0 45px;

            border-radius: 12px;

            border:
                1px solid rgba(255,255,255,0.10);

            outline: none;

            background:
                rgba(1,11,9,0.62);

            color:
                var(--white);

            font-size: 11px;

            transition:
                border 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease,
                transform 0.25s ease;
        }

        .field input::placeholder {
            color:
                #607770;
        }

        .field input:focus {
            border-color:
                rgba(99,255,177,0.7);

            background:
                rgba(4,22,17,0.85);

            box-shadow:
                0 0 0 3px rgba(99,255,177,0.06),
                0 0 28px rgba(99,255,177,0.06);

            transform:
                translateY(-1px);
        }


        /* =========================================================
           PASSWORD TOGGLE
        ========================================================= */

        .password-toggle {
            position: absolute;

            right: 10px;
            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color:
                var(--muted);

            cursor: pointer;

            font-size: 8px;

            font-weight: 600;

            letter-spacing:
                0.05em;

            padding: 6px;
        }

        .password-toggle:hover {
            color:
                var(--green);
        }


        /* =========================================================
           OPTIONS
        ========================================================= */

        .options {
            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-top: 3px;

            margin-bottom: 20px;

            font-size: 9px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 7px;

            color:
                var(--muted);

            cursor: pointer;
        }

        .remember input {
            width: 12px;
            height: 12px;

            accent-color:
                var(--green);

            cursor: pointer;
        }

        .forgot {
            border: none;

            background: transparent;

            color:
                var(--green);

            cursor: pointer;

            font-size: 9px;
        }

        .forgot:hover {
            text-decoration: underline;
        }


        /* =========================================================
           SIGN IN BUTTON
        ========================================================= */

        .login-button {
            position: relative;

            width: 100%;
            height: 51px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            overflow: hidden;

            background:
                linear-gradient(
                    110deg,
                    #7dffc5,
                    #35dda0,
                    #63ffb1,
                    #35d9df
                );

            background-size:
                250% 100%;

            color:
                #03130d;

            font-family:
                "Space Grotesk",
                sans-serif;

            font-size: 11px;

            font-weight: 700;

            letter-spacing:
                0.05em;

            box-shadow:
                0 12px 35px rgba(99,255,177,0.19);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

            animation:
                buttonGradient 5s linear infinite;
        }

        @keyframes buttonGradient {

            0% {
                background-position:
                    0% 50%;
            }

            100% {
                background-position:
                    250% 50%;
            }
        }

        .login-button:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 17px 45px rgba(99,255,177,0.30);
        }

        .login-button:active {
            transform:
                translateY(0);
        }

        .button-arrow {
            position: absolute;

            right: 17px;

            font-size: 18px;

            transition:
                transform 0.2s ease;
        }

        .login-button:hover .button-arrow {
            transform:
                translateX(5px);
        }


        /* =========================================================
           DIVIDER
        ========================================================= */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin:
                22px 0;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background:
                rgba(255,255,255,0.08);
        }

        .divider span {
            color:
                #637b74;

            font-size: 8px;

<body>

    <!-- =========================================================

    ========================================================= -->

    <div class="background">

        <div class="sky"></div>

        <div class="stars"></div>


        <!-- Distant futuristic city -->

        <div class="city">

            <div class="building"></div>

            <div class="building"></div>

            <div class="building"></div>

    <!-- =========================================================

    <main class="page">

        <section class="auth-container">


            <!-- =================================================

            ================================================= -->

            <div class="brand">

                <div class="logo">
                    ♻
                </div>

                <h1>
                    Smart Waste <span>AI</span>
                </h1>

                </p>

            </div>


            <!-- =================================================

            ================================================= -->

            <div class="card">

                    <div class="status">

                            onclick="togglePassword()"

                        class="forgot"
                        onclick="forgotPassword()"

                        Forgot password?

                <!-- =================================================

                ================================================= -->

                    type="button"
                    class="login-button"
                    onclick="login()"

                    </span>

            </div>

    <!-- =========================================================
         TEMPORARY JAVASCRIPT
         
         IMPORTANT:
         This is UI-only for now.
         Real authentication will be connected later.
    ========================================================= -->

    <script>

        /* =====================================================
           PASSWORD VISIBILITY
        ===================================================== */

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.getElementById("passwordToggle");


            if (password.type === "password") {

                password.type = "text";

                button.textContent = "HIDE";

            } else {

                password.type = "password";

                button.textContent = "SHOW";

            }

        }


        /* =====================================================
           LOGIN
        ===================================================== */

        function login() {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            if (!email) {

                alert(
                    "Please enter your email address."
                );

                return;
            }


            if (!password) {

                alert(
                    "Please enter your password."
                );

                return;
            }


            /*
             * TEMPORARY
             *
             * Real authentication will be connected to:
             *
             * FastAPI
             * PostgreSQL
             * Secure password hashing
             * Session/JWT authentication
             */

            alert(
                "Authentication will be connected in the next step."
            );

        }


        /* =====================================================
           GOOGLE LOGIN
        ===================================================== */

        function googleLogin() {

            /*
             * TEMPORARY
             *
             * Google OAuth will be connected later.
             */

            alert(
                "Google Login will be connected in the authentication setup."
            );

        }


        /* =====================================================
           CREATE ACCOUNT
        ===================================================== */

        function createAccount() {

            alert(
                "Registration will be connected in the next authentication step."
            );

        }


        /* =====================================================
           FORGOT PASSWORD
        ===================================================== */

        function forgotPassword() {

            alert(
                "Password recovery will be connected after the database authentication system is ready."
            );

        }

    </script>
